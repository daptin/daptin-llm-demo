services:
  daptin:
    image: ${DAPTIN_IMAGE:-daptin/daptin:latest}
    ports:
      - "6336:8080"
    environment:
      DAPTIN_PORT: ":8080"
      DAPTIN_DB_CONNECTION_STRING: /data/daptin.db
    volumes:
      - daptin-data:/data

  demo:
    build: .
    depends_on:
      - daptin
    ports:
      - "7777:7777"
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 7777
      DAPTIN_BASE_URL: http://localhost:6336
      DAPTIN_API_URL: http://daptin:8080
      DAPTIN_ADMIN_EMAIL: admin@example.com
      DAPTIN_ADMIN_PASSWORD: admin
      LLM_PROVIDER_TYPE: openai
      LLM_PROVIDER_NAME: openai
      LLM_MODELS: gpt-4o-mini
      LLM_API_KEY: ${LLM_API_KEY}
    command: sh -c "node scripts/setup.js && node server.js"

volumes:
  daptin-data:
